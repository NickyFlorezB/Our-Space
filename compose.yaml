services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-}
      POSTGRES_USER: ${DB_USER:-}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 5MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 45MB
      SECURITY_JWT_SECRET: ${JWT_SECRET:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      REFRESH_COOKIE_SECURE: "true"
      APP_PUSH_PUBLIC_KEY: ${APP_PUSH_PUBLIC_KEY:-}
      APP_PUSH_PRIVATE_KEY: ${APP_PUSH_PRIVATE_KEY:-}
      APP_PUSH_SUBJECT: ${APP_PUSH_SUBJECT:-}
      IMAGE_STORAGE_PATH: /data/uploads
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    volumes:
      - ${IMAGE_STORAGE_HOST_PATH:-./data/uploads}:/data/uploads
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - "8080"
    networks:
      - db_net
      - web_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/v1/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - web_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  flyway:
    image: flyway/flyway:12.4.0
    profiles:
      - maintenance
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${DB_NAME:-}
      FLYWAY_USER: ${DB_USER:-}
      FLYWAY_PASSWORD: ${DB_PASSWORD:-}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql:ro
    networks:
      - db_net
    depends_on:
      db:
        condition: service_healthy

networks:
  db_net:
    internal: true
  web_net:

volumes:
  pgdata:
    name: ${DB_VOLUME_NAME:-our-space_pgdata}
  caddy_data:
  caddy_config:
