spring:
  application:
    name: ourspace
  datasource:
    url: jdbc:postgresql://localhost:5432/ourspace
    username: espacio
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 45MB

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

security:
  jwt:
    secret: ${JWT_SECRET}

server:
  servlet:
    context-path: /api/v1

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:${FRONTEND_ORIGIN:http://localhost:4200,http://127.0.0.1:4200}}
  auth:
    refresh-cookie:
      name: refreshToken
      # Set REFRESH_COOKIE_SECURE=true in production. Use SameSite=None only across sites.
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
  push:
    public-key: ${APP_PUSH_PUBLIC_KEY:}
    private-key: ${APP_PUSH_PRIVATE_KEY:}
    subject: ${APP_PUSH_SUBJECT:}
  storage:
    root: ${IMAGE_STORAGE_PATH:/home/nicky/.ourspace/images}
  images:
    url-prefix: ${server.servlet.context-path:/api/v1}
